<!DOCTYPE html>
<html>
<head>
    <title>Supabase Test</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <h1>My Chat</h1>

    <p id="status">Testing connection...</p>

    <input id="messageInput" placeholder="Type a message">
    <button onclick="sendMessage()">Send</button>

    <div id="messages"></div>

    <script>
        const SUPABASE_URL = "https://sdituclqvqdiantpkxag.supabase.co";

        // PUT YOUR SUPABASE PUBLISHABLE KEY BETWEEN THE QUOTES
        const SUPABASE_KEY = "sb_publishable_WZX13lT4p4LJZP7OXfU8Zg_CLP1gBPO";

        const supabase = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        async function testConnection() {

            const status = document.getElementById("status");

            status.textContent = "Connecting...";

            const { data, error } = await supabase
                .from("messages")
                .select("*")
                .limit(1);

            if (error) {
                status.textContent = "ERROR: " + error.message;
                console.log(error);
                return;
            }

            status.textContent = "CONNECTED! Supabase is working.";
            console.log(data);
        }

        async function sendMessage() {

            const input = document.getElementById("messageInput");

            const message = input.value.trim();

            if (message === "") return;

            const { data, error } = await supabase
                .from("messages")
                .insert([
                    {
                        username: "Ted",
                        message: message
                    }
                ]);

            if (error) {
                alert("SEND ERROR: " + error.message);
                console.log(error);
                return;
            }

            input.value = "";

            alert("Message sent!");
        }

        testConnection();
    </script>

</body>
</html>
