<div class="header">
    <h1>My Chat</h1>
</div>

<div class="chat">

    <div class="messages" id="messages"></div>

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Type a message..."
        >

        <button onclick="sendMessage()">Send</button>

    </div>

</div>

<script>

    // Your Supabase project
    const SUPABASE_URL = "https://sdituclqvqdiantpkxag.supabase.co";

    // Your public publishable key
    const SUPABASE_KEY = "sb_publishable_WZX13lT4p4LJZP7OXfU8Zg_CLP1gBPO";

    // Connect to Supabase
    const supabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    // Ask the user for their name
    let username = prompt("What is your name?");

    // Use Guest if they leave it blank
    if (!username || username.trim() === "") {
        username = "Guest";
    }

    // Get the message box
    const messages = document.getElementById("messages");

    // Load old messages
    async function loadMessages() {

        const { data, error } = await supabase
            .from("messages")
            .select("*")
            .order("created_at", { ascending: true });

        if (error) {
            console.error(error);
            return;
        }

        messages.innerHTML = "";

        data.forEach(function(message) {
            displayMessage(message);
        });

        messages.scrollTop = messages.scrollHeight;
    }

    // Display a message on the screen
    function displayMessage(message) {

        const messageDiv = document.createElement("div");

        messageDiv.className = "message";

        if (message.username === username) {
            messageDiv.className = "message my-message";
        }

        const nameDiv = document.createElement("div");

        nameDiv.className = "name";

        nameDiv.textContent = message.username;

        const textDiv = document.createElement("div");

        textDiv.className = "message-text";

        textDiv.textContent = message.message;

        messageDiv.appendChild(nameDiv);

        messageDiv.appendChild(textDiv);

        messages.appendChild(messageDiv);

        messages.scrollTop = messages.scrollHeight;
    }

    // Send a message
    async function sendMessage() {

        const input = document.getElementById("messageInput");

        const text = input.value.trim();

        if (text === "") {
            return;
        }

        const { error } = await supabase
            .from("messages")
            .insert({
                username: username,
                message: text
            });

        if (error) {
            console.error(error);
            alert("Could not send the message.");
            return;
        }

        input.value = "";
    }

    // Press Enter to send
    document.getElementById("messageInput").addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        }
    );

    // Receive new messages instantly
    supabase
        .channel("messages-channel")
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "messages"
            },
            function(payload) {

                displayMessage(payload.new);

            }
        )
        .subscribe();

    // Start by loading existing messages
    loadMessages();

</script>
