<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://sdituclqvqdiantpkxag.supabase.co";

const SUPABASE_KEY = "sb_publishable_WZX13lT4p4LJZP7OXfU8Zg_CLP1gBPO";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let username = prompt("What is your name?");

if (!username || username.trim() === "") {
    username = "Guest";
}

username = username.trim();

const messages = document.getElementById("messages");

const status = document.getElementById("status");

async function testConnection() {

    status.textContent = "Testing connection...";

    const { data, error } = await supabase
        .from("messages")
        .select("*")
        .limit(1);

    if (error) {

        console.error("SUPABASE ERROR:", error);

        status.textContent = "ERROR: " + error.message;

        return;
    }

    status.textContent = "Connected to Supabase!";

    loadMessages();
}

async function loadMessages() {

    const { data, error } = await supabase
        .from("messages")
        .select("*")
        .order("created_at", {
            ascending: true
        });

    if (error) {

        console.error(error);

        status.textContent = "ERROR: " + error.message;

        return;
    }

    messages.innerHTML = "";

    data.forEach(function(message) {

        displayMessage(message);

    });

    messages.scrollTop = messages.scrollHeight;
}

function displayMessage(message) {

    const messageDiv = document.createElement("div");

    if (message.username === username) {
        messageDiv.className = "message my-message";
    } else {
        messageDiv.className = "message";
    }

    const nameDiv = document.createElement("div");

    nameDiv.className = "name";

    nameDiv.textContent = message.username;

    const textDiv = document.createElement("div");

    textDiv.className = "message-text";

    textDiv.textContent = message.message;

    messageDiv.appendChild(nameDiv);

    messageDiv.appendChild(textDiv);

    messages.appendChild(messageDiv);

    messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {

    const input = document.getElementById("messageInput");

    const text = input.value.trim();

    if (text === "") {
        return;
    }

    const { data, error } = await supabase
        .from("messages")
        .insert({
            username: username,
            message: text
        })
        .select();

    if (error) {

        console.error("SEND ERROR:", error);

        alert("SEND ERROR:\n" + error.message);

        return;
    }

    input.value = "";

}

document
    .getElementById("messageInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });

testConnection();

</script>
