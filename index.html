```
<div class="header">
    <h1>My Chat</h1>
</div>

<div class="chat">

    <div class="messages" id="messages"></div>

    <div class="status" id="status">
        Connecting...
    </div>

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Type a message..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script>

    // Your Supabase project
    const SUPABASE_URL =
        "https://sdituclqvqdiantpkxag.supabase.co";

    // Your public Supabase publishable key
    const SUPABASE_KEY =
        "sb_publishable_WZX13lT4p4LJZP7OXfU8Zg_CLP1gBPO";

    // Connect to Supabase
    const supabase =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // Ask for username
    let username = prompt("What is your name?");


    // If they don't enter a name
    if (!username || username.trim() === "") {

        username = "Guest";

    }


    // Remove spaces from beginning/end
    username = username.trim();


    // Get the messages area
    const messages =
        document.getElementById("messages");


    // Get status text
    const status =
        document.getElementById("status");


    // Load all previous messages
    async function loadMessages() {

        const { data, error } = await supabase

            .from("messages")

            .select("*")

            .order("created_at", {
                ascending: true
            });


        // If something went wrong
        if (error) {

            console.error(
                "Error loading messages:",
                error
            );

            status.textContent =
                "Could not load messages.";

            return;

        }


        // Clear the message area
        messages.innerHTML = "";


        // Display every message
        data.forEach(function(message) {

            displayMessage(message);

        });


        // Scroll to bottom
        messages.scrollTop =
            messages.scrollHeight;


        status.textContent =
            "Connected";
    }


    // Display a message
    function displayMessage(message) {

        const messageDiv =
            document.createElement("div");


        // Work out if this is our message
        if (message.username === username) {

            messageDiv.className =
                "message my-message";

        } else {

            messageDiv.className =
                "message";

        }


        // Username
        const nameDiv =
            document.createElement("div");

        nameDiv.className = "name";

        nameDiv.textContent =
            message.username;


        // Message text
        const textDiv =
            document.createElement("div");

        textDiv.className =
            "message-text";

        textDiv.textContent =
            message.message;


        // Put name inside message
        messageDiv.appendChild(
            nameDiv
        );


        // Put text inside message
        messageDiv.appendChild(
            textDiv
        );


        // Put message on screen
        messages.appendChild(
            messageDiv
        );


        // Scroll down
        messages.scrollTop =
            messages.scrollHeight;
    }


    // Send a message
    async function sendMessage() {

        const input =
            document.getElementById(
                "messageInput"
            );


        // Get the text
        const text =
            input.value.trim();


        // Don't send empty messages
        if (text === "") {

            return;

        }


        // Disable input while sending
        input.disabled = true;


        // Send to Supabase
        const { error } =
            await supabase

                .from("messages")

                .insert({

                    username: username,

                    message: text

                });


        // If there was an error
        if (error) {

            console.error(
                "Error sending message:",
                error
            );

            alert(
                "Could not send message.\n\n" +
                error.message
            );

        } else {

            // Clear the input
            input.value = "";

        }


        // Enable input again
        input.disabled = false;


        // Put cursor back in input
        input.focus();
    }


    // Press Enter to send
    document
        .getElementById("messageInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    sendMessage();

                }

            }
        );


    // Listen for new messages
    supabase

        .channel("messages-channel")

        .on(

            "postgres_changes",

            {

                event: "INSERT",

                schema: "public",

                table: "messages"

            },

            function(payload) {

                displayMessage(
                    payload.new
                );

            }

        )

        .subscribe(
            function(statusValue) {

                console.log(
                    "Realtime status:",
                    statusValue
                );

            }
        );


    // Load messages when page opens
    loadMessages();

</script>
